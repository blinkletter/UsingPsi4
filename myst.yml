project:
  id: bc11b329-9c8d-410a-9e7d-210747b14da5
  # title:
  # description:
  keywords: []
  authors:
    - name: Barry Linkletter
      affiliations:
        - University of Prince Edward Island
  copyright: '2026'
  description: A webbook of Psi4 examples and exercises for chemistry students.
  license: CC-BY-NC-4.0
  github: https://github.com/blinkletter/UsingPsi4
  bibliography:
    - references.bib
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: index.md
    - file: book/00-FrontMatter/001-toc.md
      children:
        - file: book/00-FrontMatter/002-notes.md
    - file: book/01-Setup/011-Setup.md
    - file: book/02-SmallMolecules/021-SmallMolecules.ipynb
    - file: book/03-VisualInput/031-VisualInput.ipynb
    - file: book/04-Ethane/041-Ethane.ipynb
    - file: book/05-RotationProfiles/051-RotationProfiles.ipynb
      children:
        - file: book/05-RotationProfiles/052-Workflow.ipynb
        - file: book/05-RotationProfiles/053-WorkflowData.ipynb
    - file: book/06-PiOrbitals/061-PiOrbitals.ipynb
    - file: book/08-Butadiene/081-Butadiene.ipynb
    - file: book/07-Benzene/071-Benzene.ipynb
    - file: book/09-DielsAlder/091-DielsAlder.ipynb
      children:
        - file: book/09-DielsAlder/092-ScanData.ipynb
